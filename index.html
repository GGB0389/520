<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>520 给最爱的你</title>
  <style>
    @font-face {
      font-family: "LoveFont";
      src: url("./my-font.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg1: rgba(49, 10, 34, 0.72);
      --bg2: rgba(126, 18, 73, 0.58);
      --panel: rgba(255, 245, 250, 0.16);
      --line: rgba(255, 255, 255, 0.24);
      --text: #fff7fb;
      --pink: #ff5f9e;
      --hot: #ff2f7d;
      --gold: #ffe6a7;
      --shadow: 0 18px 45px rgba(64, 0, 30, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      font-family: "LoveFont", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #190414;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img,
    button,
    canvas {
      -webkit-user-drag: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(135deg, var(--bg1), var(--bg2)),
        url("./bg.png") center/cover no-repeat;
      filter: saturate(1.1);
      transform: scale(1.04);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255, 209, 232, 0.32), transparent 38%),
        radial-gradient(circle at bottom right, rgba(255, 79, 143, 0.18), transparent 28%);
      pointer-events: none;
    }

    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
      isolation: isolate;
      opacity: 1;
      transition: opacity 0.65s ease;
    }

    .hearts-layer.is-hidden {
      opacity: 0;
    }

    .hearts-canvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.92;
      filter: saturate(1.08);
      mix-blend-mode: screen;
    }

    @media (prefers-reduced-motion: reduce) {
      .hearts-layer {
        opacity: 0.42;
      }

      .hearts-canvas {
        filter: none;
      }
    }

    .app {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 2;
    }

    .hero {
      width: min(92vw, 720px);
      margin-top: clamp(44px, 9vh, 88px);
      text-align: center;
      padding: 28px 24px 34px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
      backdrop-filter: blur(18px);
      border-radius: 24px;
      box-shadow: var(--shadow);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .hero.hidden {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      pointer-events: none;
    }

    .envelope-photo {
      width: min(220px, 52vw);
      margin: 0 auto 18px;
      padding: 10px 10px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 240, 247, 0.92));
      box-shadow: 0 18px 38px rgba(255, 95, 158, 0.24);
      position: relative;
      transform: rotate(-3deg);
      animation: floatPhoto 3s ease-in-out infinite;
    }

    .envelope-photo::before {
      content: "";
      position: absolute;
      inset: auto 18px -10px 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(74, 24, 48, 0.2);
      filter: blur(10px);
      z-index: -1;
    }

    .envelope-photo img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      border: 4px solid rgba(255, 255, 255, 0.95);
    }

    @keyframes floatPhoto {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(-1deg) translateY(-6px); }
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 400;
      line-height: 1.08;
      text-shadow: 0 6px 22px rgba(63, 0, 31, 0.42);
    }

    .sub {
      margin: 16px auto 0;
      max-width: 560px;
      font-size: clamp(15px, 2.4vw, 21px);
      line-height: 1.7;
      color: rgba(255, 245, 250, 0.92);
    }

    .start-btn {
      margin-top: 28px;
      position: relative;
      z-index: 1;
      border: 0;
      border-radius: 999px;
      padding: 16px 34px;
      font: inherit;
      font-size: clamp(18px, 2.8vw, 26px);
      color: white;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background: linear-gradient(135deg, #ff4f8f, #ff7ab0);
      box-shadow: 0 14px 30px rgba(255, 74, 138, 0.34);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: glow 1.8s ease-in-out infinite;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 36px rgba(255, 74, 138, 0.42);
      filter: brightness(1.03);
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 12px 28px rgba(255, 74, 138, 0.3); }
      50% { box-shadow: 0 18px 42px rgba(255, 74, 138, 0.5); }
    }

    .hint {
      margin-top: 14px;
      font-size: 15px;
      color: rgba(255, 239, 246, 0.82);
    }

    .music-heart {
      position: fixed;
      top: 34px;
      right: 34px;
      width: 50px;
      height: 50px;
      transform: rotate(45deg);
      background-color: #ff6b9e;
      border: 0;
      cursor: pointer;
      z-index: 8;
      box-shadow: 0 12px 28px rgba(255, 61, 126, 0.28);
      transition: background-color 0.3s ease, filter 0.3s ease, transform 0.3s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .music-heart::before,
    .music-heart::after {
      content: "";
      position: absolute;
      width: 50px;
      height: 50px;
      background: inherit;
      border-radius: 50%;
    }

    .music-heart::before {
      top: -25px;
      left: 0;
    }

    .music-heart::after {
      top: 0;
      left: -25px;
    }

    .music-heart.playing {
      background-color: #ff3366;
      animation: musicHeartBeat 1s ease-in-out infinite;
      filter: drop-shadow(0 0 14px rgba(255, 82, 145, 0.78));
    }

    .music-heart:hover {
      filter: drop-shadow(0 0 20px rgba(255, 82, 145, 0.75));
    }

    .music-heart:focus-visible {
      box-shadow:
        0 12px 28px rgba(255, 61, 126, 0.28),
        0 0 0 3px rgba(255, 244, 248, 0.76);
    }

    @keyframes musicHeartBeat {
      0%, 100% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.1); }
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }

    .popup {
      position: absolute;
      width: 136px;
      padding: 10px 10px 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(250, 246, 255, 0.86));
      border: 1px solid rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 30px rgba(69, 0, 35, 0.24);
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.24s ease;
      pointer-events: auto;
      overflow: hidden;
      will-change: transform, opacity;
      transform-origin: center;
    }

    .popup.show {
      opacity: 1;
    }

    .popup.scatter {
      transform: translate(-50%, -50%) scale(0.92) rotate(var(--rot));
    }

    .random-blessing {
      position: absolute;
      width: min(260px, calc(100vw - 36px));
      min-height: 88px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 243, 248, 0.66)),
        rgba(255, 248, 251, 0.8);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 16px 36px rgba(69, 0, 35, 0.14);
      opacity: 0;
      transform: translateY(0) scale(1);
      overflow: hidden;
      z-index: 5;
      will-change: transform, opacity;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .random-blessing.show {
      opacity: 1;
    }

    .random-blessing-text {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      width: 100%;
      font-size: 13px;
      line-height: 1.5;
      color: #74475f;
      white-space: normal;
      letter-spacing: 0;
    }

    .intro-popup {
      --intro-accent: #ff6f9f;
      --intro-accent-soft: rgba(255, 220, 233, 0.92);
      --intro-surface-top: rgba(255, 255, 255, 0.92);
      --intro-surface-bottom: rgba(255, 243, 248, 0.82);
      --intro-border: rgba(255, 255, 255, 0.58);
      --intro-shadow: rgba(86, 32, 59, 0.18);
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 156px;
      max-width: 210px;
      min-height: 58px;
      padding: 12px 16px 12px 14px;
      border-radius: 20px;
      border: 1px solid var(--intro-border);
      background:
        linear-gradient(180deg, var(--intro-surface-top), var(--intro-surface-bottom)),
        rgba(255, 247, 251, 0.8);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.84),
        0 18px 34px var(--intro-shadow);
      color: #6f455b;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      opacity: 0;
      transform: translateY(22px) scale(0.78);
      transition: opacity 0.42s ease, transform 0.42s cubic-bezier(.18,.88,.2,1), box-shadow 0.3s ease, filter 0.3s ease;
      pointer-events: auto;
      cursor: pointer;
      z-index: 6;
      text-align: left;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      will-change: transform, opacity;
    }

    .intro-popup-icon {
      position: relative;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.92) 0 5px, rgba(255, 255, 255, 0) 6px),
        linear-gradient(145deg, rgba(255, 255, 255, 0.9), var(--intro-accent-soft));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 8px 16px color-mix(in srgb, var(--intro-accent) 24%, transparent);
    }

    .intro-popup-icon::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      background: var(--intro-accent);
      -webkit-clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
              clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      transform: translate(-50%, -50%) rotate(14deg);
      filter: drop-shadow(0 1px 4px color-mix(in srgb, var(--intro-accent) 38%, transparent));
    }

    .intro-popup-label {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 30px;
      display: flex;
      align-items: center;
      }

    .intro-popup.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: introPopupFloat 3.6s ease-in-out infinite;
      animation-delay: var(--float-delay, 0s);
    }

    .intro-popup:hover {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        0 22px 42px color-mix(in srgb, var(--intro-accent) 16%, rgba(77, 30, 54, 0.2));
      transform: translateY(-3px) scale(1.025);
      filter: saturate(1.03);
    }

    .intro-popup:focus-visible {
      outline: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.88),
        0 22px 42px color-mix(in srgb, var(--intro-accent) 18%, rgba(77, 30, 54, 0.2)),
        0 0 0 3px rgba(255, 247, 250, 0.72);
    }

    .intro-popup.pop {
      animation: introPopupBurst 0.42s cubic-bezier(.16,.84,.22,1) forwards;
      pointer-events: none;
    }

    .intro-popup::before,
    .intro-popup::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .intro-popup::before {
      inset: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.52), transparent 42%);
      opacity: 0.92;
    }

    .intro-popup::after {
      inset: -12px;
      background:
        radial-gradient(circle at 24% 44%, rgba(255, 255, 255, 0.95) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 26%, color-mix(in srgb, var(--intro-accent) 44%, white) 0 2px, transparent 3px),
        radial-gradient(circle at 68% 78%, rgba(255, 255, 255, 0.9) 0 2px, transparent 3px),
        radial-gradient(circle at 16% 76%, color-mix(in srgb, var(--intro-accent) 26%, white) 0 2px, transparent 3px);
      opacity: 0;
      transform: scale(0.7);
    }

    .intro-popup.pop::after {
      animation: introPopupSpark 0.42s ease-out forwards;
    }

    @keyframes introPopupFloat {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      25% { transform: translateY(-4px) scale(1.01) rotate(-1deg); }
      50% { transform: translateY(-1px) scale(1.02) rotate(0.8deg); }
      75% { transform: translateY(-5px) scale(1.01) rotate(-0.6deg); }
    }

    @keyframes introPopupBurst {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); filter: blur(0); }
      35% { opacity: 1; transform: translateY(-6px) scale(1.08) rotate(-2deg); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-22px) scale(0.72) rotate(6deg); filter: blur(5px); }
    }

    @keyframes introPopupSpark {
      0% { opacity: 0; transform: scale(0.6); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.4); }
    }

    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 11px;
      color: rgba(98, 79, 93, 0.9);
    }

    .dot-line {
      display: flex;
      gap: 6px;
    }

    .dot-line span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
    }

    .popup-title {
      font-size: 13px;
      margin: 0 0 6px;
      color: #5d4457;
    }

    .popup-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(84, 62, 77, 0.92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-mini {
      width: auto;
      min-width: 72px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 244, 249, 0.9);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px rgba(83, 34, 58, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-mini .bubble-text {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      font-size: 14px;
      line-height: 1.2;
      color: #7f4761;
      white-space: nowrap;
      letter-spacing: 0;
      text-align: center;
    }

    .popup-featured {
      width: min(330px, 80vw);
      padding: 18px 18px 22px;
      border-radius: 22px;
      z-index: 6;
    }

    .popup-featured .popup-head {
      font-size: 15px;
      margin-bottom: 10px;
      color: rgba(98, 79, 93, 0.9);
    }

    .popup-featured .dot-line span {
      width: 8px;
      height: 8px;
    }

    .popup-featured .popup-title {
      font-size: 22px;
      margin: 2px 0 10px;
      color: #533349;
    }

    .popup-featured .popup-text {
      font-size: 16px;
      line-height: 1.7;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .heart-wrap {
      margin-top: 18px;
      display: grid;
      place-items: center;
    }

    .heart-shell {
      position: relative;
      width: 120px;
      height: 120px;
      cursor: pointer;
      transform: rotate(45deg);
      border: 0;
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.9), rgba(255, 107, 158, 0.96));
      box-shadow: 0 14px 36px rgba(255, 61, 126, 0.28);
      transition: transform 0.2s ease, filter 0.2s ease;
      animation: heartBeatOld 1.05s ease-in-out infinite;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-shell::before,
    .heart-shell::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: inherit;
    }

    .heart-shell::before {
      top: -60px;
      left: 0;
    }

    .heart-shell::after {
      top: 0;
      left: -60px;
    }

    .heart-shell:hover {
      filter: drop-shadow(0 0 20px rgba(255, 82, 145, 0.75));
    }

    .heart-shell:focus-visible {
      box-shadow:
        0 14px 36px rgba(255, 61, 126, 0.28),
        0 0 0 3px rgba(255, 241, 247, 0.72);
    }

    @keyframes heartBeatOld {
      0%, 100% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.1); }
    }

    .heart-canvas {
      position: absolute;
      inset: -68px 0 0 -68px;
      width: 256px;
      height: 256px;
      pointer-events: none;
      filter: drop-shadow(0 0 18px rgba(255, 82, 145, 0.55));
    }

    .tip {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(103, 76, 94, 0.78);
    }

    .window-strip {
      margin-top: 8px;
      height: 26px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.58);
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: rgba(111, 78, 98, 0.75);
      font-size: 11px;
    }

    .center-note {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: rgba(255, 247, 251, 0.9);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 4;
      pointer-events: none;
    }

    .center-note.show {
      opacity: 1;
    }

    .easter-egg {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 188px;
      height: 238px;
      transform: translate(-50%, -50%) scale(0.82);
      opacity: 0;
      pointer-events: none;
      z-index: 7;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .easter-egg-shell {
      position: absolute;
      inset: 0;
      border-radius: 52% 52% 48% 48% / 60% 60% 40% 40%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.7), transparent 20%),
        linear-gradient(180deg, #ffdd59 0 18%, #ff7eb6 18% 36%, #76e3ff 36% 54%, #8ef0b1 54% 72%, #b693ff 72% 100%);
      border: 6px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        inset 0 -14px 24px rgba(128, 31, 77, 0.16),
        0 22px 48px rgba(88, 27, 60, 0.26);
      overflow: hidden;
    }

    .easter-egg-shell::before,
    .easter-egg-shell::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
    }

    .easter-egg-shell::before {
      top: 58px;
      box-shadow:
        0 48px 0 rgba(255, 255, 255, 0.54),
        0 96px 0 rgba(255, 255, 255, 0.5);
    }

    .easter-egg-shell::after {
      top: 82px;
      left: 28px;
      right: 28px;
      height: 10px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow:
        0 48px 0 rgba(255, 255, 255, 0.34),
        0 96px 0 rgba(255, 255, 255, 0.32);
    }

    .easter-egg.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: easterEggWobble 1.1s ease-in-out infinite;
    }

    .easter-egg-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-size: 24px;
      line-height: 1.35;
      text-align: center;
      text-shadow: 0 4px 18px rgba(124, 12, 58, 0.28);
      padding: 52px 28px 34px;
      box-sizing: border-box;
      font-weight: 600;
    }

    @keyframes easterEggWobble {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      20% { transform: translate(-50%, -50%) rotate(-7deg) scale(1.01); }
      40% { transform: translate(-50%, -50%) rotate(6deg) scale(1.02); }
      60% { transform: translate(-50%, -50%) rotate(-5deg) scale(1.01); }
      80% { transform: translate(-50%, -50%) rotate(4deg) scale(1); }
    }

    .love-counter {
      position: fixed;
      left: 18px;
      top: 20px;
      z-index: 8;
      padding: 10px 14px;

    ];
    const ambientHeartShape = buildHeartPath();
    const ambientPetalShape = buildPetalPath();

    function setMusicState(playing) {
      musicPlaying = playing;
      musicHeart.classList.toggle("playing", playing);
    }

    function buildHeartPath() {
      const path = new Path2D();

      for (let index = 0; index <= 72; index += 1) {
        const t = (index / 72) * Math.PI * 2;
        const x = (16 * Math.pow(Math.sin(t), 3)) / 18;
        const y = -(
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t)
        ) / 18;

        if (index === 0) {
          path.moveTo(x, y);
        } else {
          path.lineTo(x, y);
        }
      }

      path.closePath();
      return path;
    }

    function buildPetalPath() {
      const path = new Path2D();
      path.moveTo(0, -1);
      path.bezierCurveTo(0.72, -0.82, 0.94, 0.08, 0, 1);
      path.bezierCurveTo(-0.94, 0.08, -0.72, -0.82, 0, -1);
      path.closePath();
      return path;
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function lerp(min, max, factor) {
      return min + (max - min) * factor;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function cubicBezierPoint(start, control1, control2, end, t) {
      const inverse = 1 - t;
      return (
        inverse * inverse * inverse * start +
        3 * inverse * inverse * t * control1 +
        3 * inverse * t * t * control2 +
        t * t * t * end
      );
    }

    function cubicBezierTangent(start, control1, control2, end, t) {
      const inverse = 1 - t;
      return (
        3 * inverse * inverse * (control1 - start) +
        6 * inverse * t * (control2 - control1) +
        3 * t * t * (end - control2)
      );
    }

        async function playMusic() {
      try {
        await bgm.play();
        setMusicState(true);
      } catch (error) {
        note.textContent = "如果音乐没有自动响起，点右上角爱心就能播放";

    function resizeAmbientHeartsScene() {

      heartsCanvas.style.height = `${height}px`;
      heartsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function createAmbientHeart(initialProgress = 0) {
      const depth = Math.pow(Math.random(), 1.18);
      const palette = ambientHeartPalettes[Math.floor(Math.random() * ambientHeartPalettes.length)];
      const side = Math.random() > 0.5 ? 1 : -1;
      const size = lerp(isMobile ? 16 : 18, isMobile ? 32 : 52, depth);
      const duration = lerp(isMobile ? 24 : 28, isMobile ? 16.5 : 20.5, depth);
      const startXRatio = side < 0 ? randomBetween(0.06, 0.26) : randomBetween(0.74, 0.94);
      const endXRatio = clamp(
        startXRatio + side * randomBetween(-0.24, -0.08) + randomBetween(-0.05, 0.05),
        0.12,
        0.88
      );
      const control1XRatio = clamp(
        startXRatio + side * randomBetween(-0.2, -0.06),
        0.08,
        0.92
      );
      const control2XRatio = clamp(
        endXRatio + side * randomBetween(0.02, 0.12),
        0.08,
        0.92
      );

      return {
        age: initialProgress * duration,
        duration,
        depth,
        side,
        size,
        startXRatio,
        control1XRatio,
        control2XRatio,
        endXRatio,
        startYRatio: randomBetween(1.04, 1.18),
        control1YRatio: randomBetween(0.72, 0.98),
        control2YRatio: randomBetween(0.16, 0.42),
        endYRatio: randomBetween(-0.22, -0.08),
        swayAmplitude: lerp(2, isMobile ? 8 : 12, depth),

    function createAmbientGlimmer(initialProgress = 0) {

    function createAmbientMeteor(initialProgress = 0, options = {}) {
      const mode = options.mode ?? ambientMeteorMode;
      const letterMode = mode === "letter";
      const featured = letterMode
        ? Math.random() > (isMobile ? 0.44 : 0.36)
        : Math.random() > 0.86;
      const direction = letterMode ? 1 : (Math.random() > 0.34 ? 1 : -1);
      const waitDuration = letterMode
        ? randomBetween(prefersReducedMotion ? 0.7 : 0.18, prefersReducedMotion ? 1.3 : 0.62)
        : randomBetween(prefersReducedMotion ? 1.8 : 0.9, prefersReducedMotion ? 3.4 : 2.6);
      const travelDuration = letterMode
        ? (isMobile ? 2.28 : 1.92)
        : randomBetween(isMobile ? 1.5 : 1.2, isMobile ? 2.15 : 1.8);
      const palette = ambientMeteorPalettes[Math.floor(Math.random() * ambientMeteorPalettes.length)];
      const startXRatio = letterMode
        ? randomBetween(isMobile ? 0.06 : 0.12, isMobile ? 0.78 : 0.82)
        : (direction > 0 ? randomBetween(-0.24, 0.08) : randomBetween(0.92, 1.18));
      const startYRatio = letterMode ? randomBetween(-0.16, 0.02) : randomBetween(0.04, 0.28);
      const endXRatio = letterMode
        ? Math.min(1.08, startXRatio + randomBetween(isMobile ? 0.12 : 0.14, isMobile ? 0.22 : 0.28))
        : (direction > 0 ? randomBetween(0.72, 1.12) : randomBetween(-0.12, 0.3));
      const endYRatio = letterMode
        ? startYRatio + randomBetween(isMobile ? 0.44 : 0.38, isMobile ? 0.62 : 0.54)
        : startYRatio + randomBetween(0.12, 0.24);

      return {
        age: initialProgress * (waitDuration + travelDuration),
        duration: waitDuration + travelDuration,
        waitDuration,
        travelDuration,
        direction,
        startXRatio,
        endXRatio,
        startYRatio,
        endYRatio,
        length: letterMode
          ? randomBetween(
              isMobile ? (featured ? 124 : 108) : (featured ? 168 : 144),
              isMobile ? (featured ? 188 : 152) : (featured ? 254 : 214)
            )
          : randomBetween(isMobile ? 88 : 112, isMobile ? 136 : 176),
        thickness: letterMode
          ? randomBetween(
              featured ? 2.8 : 2.4,
              isMobile ? (featured ? 4.6 : 3.8) : (featured ? 5.6 : 4.8)
            )
          : randomBetween(2.1, isMobile ? 3.6 : 4.4),
        headSize: letterMode
          ? randomBetween(
              featured ? 5.4 : 4.6,
              isMobile ? (featured ? 8.2 : 7.2) : (featured ? 10.2 : 8.6)
            )
          : randomBetween(4.5, isMobile ? 6.6 : 8.2),
        alpha: letterMode
          ? randomBetween(featured ? 0.24 : 0.19, featured ? 0.42 : 0.33)
          : randomBetween(0.16, 0.3),
        glowBlur: letterMode ? (featured ? 26 : 20) : 18,
        glowScale: letterMode ? (featured ? 3.6 : 3.2) : 2.8,
        flashStrength: letterMode
          ? randomBetween(featured ? 0.28 : 0.16, featured ? 0.48 : 0.3)
          : randomBetween(0.04, 0.12),
        flashPhase: randomBetween(0, Math.PI * 2),
        flashSpeed: letterMode
          ? randomBetween(6.8, 7.4)
          : randomBetween(4.6, 6.4),
        flashSize: letterMode
          ? randomBetween(isMobile ? (featured ? 8 : 6) : (featured ? 12 : 8.5), isMobile ? (featured ? 12 : 8.5) : (featured ? 18 : 12))
          : randomBetween(isMobile ? 3.6 : 4.2, isMobile ? 5.4 : 6.2),
        progressMode: letterMode ? "linear" : "ease-out",
        mode,
        featured,
        palette
      };
    }

    function rebuildAmbientMeteors(initialProgressMax = 1) {
      const burstCount = ambientMeteorMode === "letter"
        ? ambientMeteorCount + (isMobile ? 1 : 2)
        : ambientMeteorCount;
      ambientMeteorBursts = Array.from({ length: burstCount }, () =>
        createAmbientMeteor(Math.random() * initialProgressMax, { mode: ambientMeteorMode })
      );
    }

    function setAmbientMeteorMode(mode = "default") {
      ambientMeteorMode = mode;
      if (!ambientHeartsEnabled || !heartsCtx) {
        return;
      }
      rebuildAmbientMeteors(mode === "letter" ? 0.34 : 1);
    }

    function queueLetterIntroMeteor() {
      if (!ambientHeartsEnabled || !heartsCtx) {
        return null;
      }

      const introMeteor = createAmbientMeteor(0, { mode: "letter" });
      introMeteor.waitDuration = prefersReducedMotion ? 0.08 : 0.03;
      introMeteor.travelDuration = isMobile ? 1.52 : 1.26;
      introMeteor.duration = introMeteor.waitDuration + introMeteor.travelDuration;
      introMeteor.startXRatio = randomBetween(isMobile ? 0.06 : 0.12, isMobile ? 0.22 : 0.28);
      introMeteor.endXRatio = Math.min(1.08, introMeteor.startXRatio + randomBetween(isMobile ? 0.4 : 0.44, isMobile ? 0.54 : 0.62));
      introMeteor.startYRatio = randomBetween(-0.22, -0.12);
      introMeteor.endYRatio = introMeteor.startYRatio + randomBetween(isMobile ? 0.56 : 0.48, isMobile ? 0.72 : 0.62);
      introMeteor.length = randomBetween(isMobile ? 220 : 300, isMobile ? 300 : 388);
      introMeteor.thickness = randomBetween(isMobile ? 5.2 : 6, isMobile ? 7.2 : 8.8);
      introMeteor.headSize = randomBetween(isMobile ? 9.5 : 11.5, isMobile ? 13.5 : 16.5);
      introMeteor.alpha = randomBetween(0.38, 0.52);
      introMeteor.glowBlur = isMobile ? 28 : 34;
      introMeteor.glowScale = 4.1;
      introMeteor.flashStrength = randomBetween(0.42, 0.58);
      introMeteor.flashSpeed = randomBetween(6.9, 7.3);
      introMeteor.flashSize = randomBetween(isMobile ? 12 : 16, isMobile ? 18 : 24);
      introMeteor.featured = true;
      ambientMeteorBursts.push(introMeteor);
      return introMeteor;
    }

    function clearLetterDeliverySequence() {
      letterDeliveryTimers.forEach((timer) => clearTimeout(timer));
      letterDeliveryTimers = [];
      if (letterDropLayer) {
        letterDropLayer.replaceChildren();
      }
    }

    function getAmbientMeteorPoint(meteor, progress) {
      const startX = ambientHeartScene.width * meteor.startXRatio;
      const endX = ambientHeartScene.width * meteor.endXRatio;
      const startY = ambientHeartScene.height * meteor.startYRatio;
      const endY = ambientHeartScene.height * meteor.endYRatio;
      const motionProgress = meteor.progressMode === "linear" ? progress : easeOutCubic(progress);

      return {
        x: lerp(startX, endX, motionProgress),
        y: lerp(startY, endY, motionProgress),
        angle: Math.atan2(endY - startY, endX - startX)
      };
    }

    function dropLetterFromMeteor(meteor, progress = 0.38) {
      if (!letterDropLayer || !romanceStarted) {
        return;
      }

      const drop = document.createElement("div");
      const width = randomBetween(isMobile ? 96 : 116, isMobile ? 120 : 140);
      const start = getAmbientMeteorPoint(meteor, progress);
      const targetX = window.innerWidth * 0.5 - width / 2;
      const targetY = window.innerHeight * (isMobile ? 0.34 : 0.3) - (width / 1.18) / 2;
      const startX = start.x - width * 0.2;
      const startY = start.y - width * 0.26;
      const startRotate = `${((start.angle * 180) / Math.PI) + randomBetween(-6, 6)}deg`;
      const endRotate = `${randomBetween(-8, 8).toFixed(2)}deg`;
      const duration = isMobile ? 1.04 : 0.92;

      drop.className = "letter-drop";
      drop.innerHTML = `
        <span class="letter-drop-envelope"></span>
        <span class="letter-drop-seal"></span>
        <span class="letter-drop-shadow"></span>
      `;
      drop.style.setProperty("--drop-width", `${width.toFixed(2)}px`);
      drop.style.setProperty("--drop-start-x", `${startX.toFixed(2)}px`);
      drop.style.setProperty("--drop-start-y", `${startY.toFixed(2)}px`);
      drop.style.setProperty("--drop-end-x", `${targetX.toFixed(2)}px`);
      drop.style.setProperty("--drop-end-y", `${targetY.toFixed(2)}px`);
      drop.style.setProperty("--drop-rotate-start", startRotate);
      drop.style.setProperty("--drop-rotate-end", endRotate);
      drop.style.setProperty("--drop-duration", `${duration.toFixed(2)}s`);
      letterDropLayer.appendChild(drop);
      drop.addEventListener("animationend", () => {
        drop.remove();
      }, { once: true });
    }

    function playLetterDeliverySequence() {
      clearLetterDeliverySequence();
      const introMeteor = queueLetterIntroMeteor();
      if (!introMeteor) {
        return delay(isMobile ? 1200 : 1400);
      }

      const dropProgress = 0.38;
      const dropDelay = (introMeteor.waitDuration + introMeteor.travelDuration * dropProgress) * 1000;
      const revealDelay = dropDelay + (isMobile ? 1160 : 1040);

      letterDeliveryTimers.push(setTimeout(() => {
        dropLetterFromMeteor(introMeteor, dropProgress);
      }, dropDelay));

      return delay(revealDelay);
    }

    function createAmbientPetal(initialProgress = 0) {
      const depth = Math.pow(Math.random(), 1.12);
      const palette = ambientPetalPalettes[Math.floor(Math.random() * ambientPetalPalettes.length)];
      const duration = lerp(isMobile ? 23 : 27, isMobile ? 15 : 18, depth);

      return {

        xRatio: randomBetween(0.05, 0.95),

      };

    function createAmbientRipple(x, y) {
      const palette = ambientHeartPalettes[Math.floor(Math.random() * ambientHeartPalettes.length)];
      const heartCount = isMobile ? 5 : 7;

      return {
        x,
        y,
        age: 0,
        duration: prefersReducedMotion ? 0.78 : 1.12,

        ringEnd: isMobile ? 78 : 108,
        palette,
        hearts: Array.from({ length: heartCount }, (_, index) => ({
          angle: (Math.PI * 2 * index) / heartCount + randomBetween(-0.22, 0.22),
          size: randomBetween(5, isMobile ? 8 : 10),

        }))
      };

    function drawAmbientHeart(heart) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const width = ambientHeartScene.width;
      const height = ambientHeartScene.height;
      const progress = heart.age / heart.duration;
      const arc = Math.pow(Math.sin(Math.min(1, progress) * Math.PI), 1.06);
      const alpha = heart.opacity * Math.max(0, arc);

      if (alpha <= 0.003) {
        return;
      }

      const startX = width * heart.startXRatio;
      const control1X = width * heart.control1XRatio;
      const control2X = width * heart.control2XRatio;
      const endX = width * heart.endXRatio;
      const startY = height * heart.startYRatio;
      const control1Y = height * heart.control1YRatio;
      const control2Y = height * heart.control2YRatio;
      const endY = height * heart.endYRatio;
      const x = cubicBezierPoint(startX, control1X, control2X, endX, progress) +
        Math.sin(progress * Math.PI * 2 * heart.swaySpeed + heart.phase) *
        heart.swayAmplitude *
        (1 - progress * 0.4);
      const y = cubicBezierPoint(startY, control1Y, control2Y, endY, progress);
      const tangentX = cubicBezierTangent(startX, control1X, control2X, endX, progress);
      const tangentY = cubicBezierTangent(startY, control1Y, control2Y, endY, progress);
      const pulse = 0.95 + Math.sin(progress * Math.PI * 2 * 1.08 + heart.pulseOffset) * 0.045;
      const scale = heart.size * pulse;
      const rotation = Math.atan2(tangentY, tangentX) + Math.PI / 2 +
        heart.rotationOffset +
        Math.sin(progress * Math.PI * 2 * heart.rotationSwing + heart.phase) * 0.12;

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.rotate(rotation);
      heartsCtx.scale(scale, scale);

      heartsCtx.save();
      heartsCtx.rotate(-0.32 * heart.side);
      heartsCtx.scale(heart.haloScale * 1.18, heart.haloScale * 0.88);
      const trailGradient = heartsCtx.createRadialGradient(0.18 * heart.side, 0.18, 0, 0, 0.08, 1.2);
      trailGradient.addColorStop(0, "rgba(255, 255, 255, 0.2)");
      trailGradient.addColorStop(0.3, heart.palette.halo);
      trailGradient.addColorStop(1, "rgba(255, 255, 255, 0)");
      heartsCtx.globalAlpha = alpha * 0.72;
      heartsCtx.fillStyle = trailGradient;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0.08, 1.16, 0, Math.PI * 2);
      heartsCtx.fill();
      heartsCtx.restore();

      const haloGradient = heartsCtx.createRadialGradient(0, 0.06, 0, 0, 0.06, heart.haloScale);
      haloGradient.addColorStop(0, heart.palette.halo);
      haloGradient.addColorStop(0.32, "rgba(255, 255, 255, 0.14)");
      haloGradient.addColorStop(1, "rgba(255, 255, 255, 0)");
      heartsCtx.globalAlpha = alpha * 0.95;
      heartsCtx.fillStyle = haloGradient;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0.08, heart.haloScale, 0, Math.PI * 2);
      heartsCtx.fill();

      const fillGradient = heartsCtx.createLinearGradient(-0.7, -0.9, 0.8, 1.05);
      fillGradient.addColorStop(0, heart.palette.highlight);
      fillGradient.addColorStop(0.28, heart.palette.start);
      fillGradient.addColorStop(0.68, heart.palette.mid);
      fillGradient.addColorStop(1, heart.palette.end);

      if (heart.outline) {
        heartsCtx.globalAlpha = alpha * 0.28;
        heartsCtx.fillStyle = heart.palette.glow;
        heartsCtx.fill(ambientHeartShape);

        heartsCtx.globalAlpha = alpha * 0.96;
        heartsCtx.strokeStyle = fillGradient;
        heartsCtx.lineWidth = heart.outlineWidth;
        heartsCtx.lineJoin = "round";
        heartsCtx.stroke(ambientHeartShape);
      } else {
        heartsCtx.globalAlpha = alpha;
        heartsCtx.fillStyle = fillGradient;
        heartsCtx.fill(ambientHeartShape);

        heartsCtx.globalAlpha = alpha * 0.28;
        heartsCtx.fillStyle = heart.palette.glow;
        heartsCtx.fill(ambientHeartShape);

        heartsCtx.save();
        heartsCtx.translate(-0.14, -0.2);
        heartsCtx.scale(0.48, 0.48);
        heartsCtx.globalAlpha = alpha * 0.46;
        heartsCtx.fillStyle = "rgba(255, 255, 255, 0.9)";
        heartsCtx.fill(ambientHeartShape);
        heartsCtx.restore();
      }

      if (heart.sparkle > 0) {
        heartsCtx.globalAlpha = alpha * heart.sparkle;
        heartsCtx.fillStyle = "rgba(255, 255, 255, 0.96)";
        heartsCtx.beginPath();
        heartsCtx.arc(0.32, -0.28, 0.065, 0, Math.PI * 2);
        heartsCtx.fill();
      }

      heartsCtx.restore();
    }

    function drawAmbientBubble(bubble) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const progress = bubble.age / bubble.duration;
      const eased = easeOutCubic(Math.min(1, progress));
      const alpha = bubble.alpha * (0.24 + Math.sin(Math.min(1, progress) * Math.PI) * 0.76);

      if (alpha <= 0.003) {
        return;
      }

      const x = ambientHeartScene.width * bubble.xRatio +
        Math.sin(progress * Math.PI * 2 * bubble.swaySpeed + bubble.phase) * bubble.driftX;
      const y = ambientHeartScene.height * lerp(bubble.startYRatio, bubble.endYRatio, eased) +
        Math.cos(progress * Math.PI * 2 * (bubble.swaySpeed * 0.82) + bubble.phase * 0.6) * bubble.driftY;
      const pulse = 0.96 + Math.sin(progress * Math.PI * 2 * 0.9 + bubble.pulseOffset) * 0.04;

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.scale(pulse, pulse);

      const glow = heartsCtx.createRadialGradient(-bubble.radius * 0.2, -bubble.radius * 0.3, 0, 0, 0, bubble.radius * 1.35);
      glow.addColorStop(0, bubble.palette.glow);
      glow.addColorStop(1, "rgba(255, 255, 255, 0)");
      heartsCtx.globalAlpha = alpha * 0.78;
      heartsCtx.fillStyle = glow;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, bubble.radius * 1.3, 0, Math.PI * 2);
      heartsCtx.fill();

      const fill = heartsCtx.createRadialGradient(-bubble.radius * 0.24, -bubble.radius * 0.32, 0, 0, 0, bubble.radius);
      fill.addColorStop(0, "rgba(255, 255, 255, 0.24)");
      fill.addColorStop(0.44, bubble.palette.fill);
      fill.addColorStop(1, "rgba(255, 255, 255, 0.02)");
      heartsCtx.globalAlpha = alpha * 0.5;
      heartsCtx.fillStyle = fill;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, bubble.radius, 0, Math.PI * 2);
      heartsCtx.fill();

      heartsCtx.globalAlpha = alpha;
      heartsCtx.strokeStyle = bubble.palette.edge;
      heartsCtx.lineWidth = bubble.ringWidth;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, bubble.radius, 0, Math.PI * 2);
      heartsCtx.stroke();

      heartsCtx.globalAlpha = alpha * 0.82;
      heartsCtx.strokeStyle = "rgba(255, 255, 255, 0.84)";
      heartsCtx.lineWidth = Math.max(0.6, bubble.ringWidth * 0.46);
      heartsCtx.beginPath();
      heartsCtx.arc(-bubble.radius * 0.18, -bubble.radius * 0.14, bubble.radius * 0.42, Math.PI * 1.08, Math.PI * 1.72);
      heartsCtx.stroke();

      if (bubble.satellite > 0) {
        heartsCtx.globalAlpha = alpha * 0.72;
        heartsCtx.fillStyle = "rgba(255, 255, 255, 0.52)";
        heartsCtx.beginPath();
        heartsCtx.arc(bubble.radius * 0.72, -bubble.radius * 0.76, bubble.radius * bubble.satellite * 0.32, 0, Math.PI * 2);
        heartsCtx.fill();
      }

      heartsCtx.restore();
    }

    function drawAmbientStardust(star) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const progress = star.age / star.duration;
      const x = ambientHeartScene.width * star.xRatio +
        Math.sin(star.phase + progress * Math.PI * 2 * star.swaySpeed) * star.swayX;
      const y = ambientHeartScene.height * star.yRatio +
        Math.cos(star.phase * 0.74 + progress * Math.PI * 2 * (star.swaySpeed * 0.8)) * star.swayY;
      const twinkle = 0.5 + 0.5 * Math.sin(star.phase + star.age * star.twinkleSpeed);
      const alpha = star.alpha * (0.38 + twinkle * 0.62);

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.globalAlpha = alpha;
      heartsCtx.fillStyle = star.color;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, star.radius, 0, Math.PI * 2);
      heartsCtx.fill();

      if (star.sparkle > 0 && twinkle > 0.72) {
        heartsCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        heartsCtx.lineWidth = 0.8;
        heartsCtx.globalAlpha = alpha * star.sparkle;
        heartsCtx.beginPath();
        heartsCtx.moveTo(-star.radius * 2.2, 0);
        heartsCtx.lineTo(star.radius * 2.2, 0);
        heartsCtx.moveTo(0, -star.radius * 2.2);
        heartsCtx.lineTo(0, star.radius * 2.2);
        heartsCtx.stroke();
      }

      heartsCtx.restore();
    }

    function drawAmbientGlimmer(trail) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const progress = trail.age / trail.duration;
      const eased = easeOutCubic(Math.min(1, progress));
      const x = ambientHeartScene.width * (trail.startX + trail.direction * trail.travelX * eased);
      const y = ambientHeartScene.height * (trail.yRatio + trail.travelY * eased);
      const alpha = trail.alpha * Math.sin(Math.min(1, progress) * Math.PI);

      if (alpha <= 0.003) {
        return;
      }

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.rotate(trail.rotation);
      heartsCtx.scale(trail.length, trail.thickness);
      const gradient = heartsCtx.createLinearGradient(-1, 0, 1, 0);
      gradient.addColorStop(0, "rgba(255, 255, 255, 0)");
      gradient.addColorStop(0.4, "rgba(255, 242, 249, 0.74)");
      gradient.addColorStop(0.52, "rgba(255, 255, 255, 0.98)");
      gradient.addColorStop(0.7, "rgba(255, 225, 239, 0.54)");
      gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
      heartsCtx.globalAlpha = alpha;
      heartsCtx.fillStyle = gradient;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, 1, 0, Math.PI * 2);
      heartsCtx.fill();
      heartsCtx.restore();
    }

    function drawAmbientMeteor(meteor) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const elapsed = meteor.age - meteor.waitDuration;
      if (elapsed <= 0) {
        return;
      }

      const progress = clamp(elapsed / meteor.travelDuration, 0, 1);
      const motionProgress = meteor.progressMode === "linear" ? progress : easeOutCubic(progress);
      const alpha = meteor.alpha * Math.sin(progress * Math.PI);

      if (alpha <= 0.003) {
        return;
      }

      const startX = ambientHeartScene.width * meteor.startXRatio;
      const endX = ambientHeartScene.width * meteor.endXRatio;
      const startY = ambientHeartScene.height * meteor.startYRatio;
      const endY = ambientHeartScene.height * meteor.endYRatio;
      const { x, y, angle } = getAmbientMeteorPoint(meteor, progress);
      const flashWave = 0.5 + 0.5 * Math.sin(progress * Math.PI * meteor.flashSpeed + meteor.flashPhase);
      const flash = 1 + flashWave * meteor.flashStrength;

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.rotate(angle);

      heartsCtx.globalAlpha = alpha * 0.58 * flash;
      heartsCtx.shadowColor = meteor.palette.glow;
      heartsCtx.shadowBlur = meteor.glowBlur;
      heartsCtx.fillStyle = meteor.palette.glow;
      heartsCtx.beginPath();
      heartsCtx.ellipse(-meteor.length * 0.34, 0, meteor.length * 0.38, meteor.thickness * meteor.glowScale, 0, 0, Math.PI * 2);
      heartsCtx.fill();

      heartsCtx.shadowBlur = 0;
      heartsCtx.globalAlpha = alpha;
      const gradient = heartsCtx.createLinearGradient(-meteor.length, 0, meteor.headSize * 1.2, 0);
      gradient.addColorStop(0, "rgba(255, 255, 255, 0)");
      gradient.addColorStop(0.42, meteor.palette.tailSoft);
      gradient.addColorStop(0.78, meteor.palette.tailCore);
      gradient.addColorStop(1, meteor.palette.head);
      heartsCtx.fillStyle = gradient;
      heartsCtx.beginPath();
      heartsCtx.roundRect(-meteor.length, -meteor.thickness / 2, meteor.length + meteor.headSize * 1.35, meteor.thickness, meteor.thickness);
      heartsCtx.fill();

      heartsCtx.globalAlpha = alpha * flash;
      heartsCtx.fillStyle = meteor.palette.head;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, meteor.headSize, 0, Math.PI * 2);
      heartsCtx.fill();

      heartsCtx.globalAlpha = alpha * (0.44 + flashWave * 0.3);
      heartsCtx.fillStyle = "rgba(255, 255, 255, 0.94)";
      heartsCtx.beginPath();
      heartsCtx.arc(-meteor.headSize * 0.24, -meteor.headSize * 0.2, meteor.headSize * 0.34, 0, Math.PI * 2);
      heartsCtx.fill();

      if (meteor.flashSize > 0) {
        heartsCtx.globalAlpha = alpha * (0.18 + flashWave * 0.5);
        heartsCtx.strokeStyle = "rgba(255, 255, 255, 0.92)";
        heartsCtx.lineWidth = Math.max(0.8, meteor.thickness * 0.34);
        heartsCtx.lineCap = "round";
        heartsCtx.beginPath();
        heartsCtx.moveTo(-meteor.flashSize, 0);
        heartsCtx.lineTo(meteor.flashSize, 0);
        heartsCtx.moveTo(0, -meteor.flashSize * 0.56);
        heartsCtx.lineTo(0, meteor.flashSize * 0.56);
        heartsCtx.stroke();
      }

      heartsCtx.restore();
    }

    function drawAmbientPetal(petal) {
      if (!heartsCtx || !ambientHeartScene.width || !ambientHeartScene.height) {
        return;
      }

      const progress = petal.age / petal.duration;
      const arc = Math.sin(Math.min(1, progress) * Math.PI);
      const alpha = petal.alpha * (0.3 + arc * 0.7);

      if (alpha <= 0.003) {
        return;
      }

      const x = ambientHeartScene.width * petal.xRatio +
        Math.sin(progress * Math.PI * 2 * petal.swaySpeed + petal.phase) * petal.amplitude +
        petal.drift * (progress - 0.5);
      const y = -petal.size * 2 + progress * (ambientHeartScene.height + petal.size * 4.2);
      const rotation = petal.rotation + petal.age * petal.spin;

      heartsCtx.save();
      heartsCtx.translate(x, y);
      heartsCtx.rotate(rotation);
      heartsCtx.scale(petal.size * 0.62, petal.size);

      const glow = heartsCtx.createRadialGradient(0, 0, 0, 0, 0, 1.55);
      glow.addColorStop(0, petal.palette.glow);
      glow.addColorStop(1, "rgba(255, 255, 255, 0)");
      heartsCtx.globalAlpha = alpha * 0.92;
      heartsCtx.fillStyle = glow;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0.04, 1.48, 0, Math.PI * 2);
      heartsCtx.fill();

      const fillGradient = heartsCtx.createLinearGradient(-0.25, -1, 0.4, 1);
      fillGradient.addColorStop(0, "rgba(255, 255, 255, 0.92)");
      fillGradient.addColorStop(0.22, petal.palette.fill);
      fillGradient.addColorStop(1, "rgba(255, 173, 208, 0.8)");
      heartsCtx.globalAlpha = alpha;
      heartsCtx.fillStyle = fillGradient;
      heartsCtx.fill(ambientPetalShape);

      heartsCtx.strokeStyle = petal.palette.edge;
      heartsCtx.lineWidth = 0.07;
      heartsCtx.beginPath();
      heartsCtx.moveTo(0, -0.62);
      heartsCtx.quadraticCurveTo(0.06, -0.02, 0.02, 0.72);
      heartsCtx.stroke();
      heartsCtx.restore();
    }

    function drawAmbientRipple(ripple) {
      if (!heartsCtx) {
        return;
      }

      const progress = ripple.age / ripple.duration;
      const eased = easeOutCubic(Math.min(1, progress));
      const alpha = Math.pow(1 - progress, 1.35);
      const radius = lerp(ripple.ringStart, ripple.ringEnd, eased);

      if (alpha <= 0.004) {
        return;
      }

      heartsCtx.save();
      heartsCtx.translate(ripple.x, ripple.y);
      heartsCtx.globalAlpha = alpha * 0.52;
      heartsCtx.strokeStyle = ripple.palette.highlight;
      heartsCtx.lineWidth = lerp(2.2, 0.7, progress);
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, radius, 0, Math.PI * 2);
      heartsCtx.stroke();

      heartsCtx.globalAlpha = alpha * 0.2;
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, radius * 0.66, 0, Math.PI * 2);
      heartsCtx.stroke();

      heartsCtx.globalAlpha = alpha * 0.65;
      heartsCtx.fillStyle = "rgba(255, 255, 255, 0.94)";
      heartsCtx.beginPath();
      heartsCtx.arc(0, 0, lerp(5.5, 1.4, progress), 0, Math.PI * 2);
      heartsCtx.fill();

      ripple.hearts.forEach((miniHeart) => {
        const angle = miniHeart.angle + progress * Math.PI * (0.48 + miniHeart.spin * 0.16);
        const orbit = radius + miniHeart.offset * progress;
        const x = Math.cos(angle) * orbit;
        const y = Math.sin(angle) * orbit;
        const size = miniHeart.size * (0.84 + eased * 0.3);

        heartsCtx.save();
        heartsCtx.translate(x, y);
        heartsCtx.rotate(angle + Math.PI / 2 + miniHeart.spin * progress);
        heartsCtx.scale(size, size);
        const gradient = heartsCtx.createLinearGradient(-0.7, -0.9, 0.8, 1.05);
        gradient.addColorStop(0, ripple.palette.highlight);
        gradient.addColorStop(0.48, ripple.palette.start);
        gradient.addColorStop(1, ripple.palette.end);
        heartsCtx.globalAlpha = alpha;
        heartsCtx.fillStyle = gradient;
        heartsCtx.fill(ambientHeartShape);
        heartsCtx.restore();
      });

      heartsCtx.restore();
    }

    function spawnAmbientRipple(x, y) {
      if (!heartsCtx || !ambientHeartsEnabled) {
        return;
      }

      ambientRippleBursts.push(createAmbientRipple(x, y));
      if (ambientRippleBursts.length > 8) {
        ambientRippleBursts.shift();
      }
    }

    function animateAmbientHearts(timestamp) {
      if (!ambientHeartsEnabled || !heartsCtx) {
        return;
      }

      if (!ambientHeartScene.width || !ambientHeartScene.height) {
        resizeAmbientHeartsScene();
      }

      if (!ambientHeartLastTime) {
        ambientHeartLastTime = timestamp;
      }

      const delta = Math.min((timestamp - ambientHeartLastTime) / 1000, 0.033);
      ambientHeartLastTime = timestamp;

      heartsCtx.clearRect(0, 0, ambientHeartScene.width, ambientHeartScene.height);

      ambientGlimmerTrails.forEach((trail) => {
        trail.age += delta;
        if (trail.age >= trail.duration) {
          Object.assign(trail, createAmbientGlimmer(randomBetween(0, 0.25)));
        }
        drawAmbientGlimmer(trail);
      });

      ambientMeteorBursts.forEach((meteor) => {
        meteor.age += delta;
        if (meteor.age >= meteor.duration) {
          Object.assign(meteor, createAmbientMeteor(randomBetween(0, 0.08)));
        }
        drawAmbientMeteor(meteor);
      });

      ambientStardustParticles.forEach((star) => {
        star.age += delta;
        if (star.age >= star.duration) {
          Object.assign(star, createAmbientStardust());
        }
        drawAmbientStardust(star);
      });

      ambientHeartParticles.sort((first, second) => first.depth - second.depth).forEach((heart) => {
        heart.age += delta;
        if (heart.age >= heart.duration) {
          Object.assign(heart, createAmbientHeart());
        }
        drawAmbientHeart(heart);
      });

      ambientBubbleParticles.sort((first, second) => first.depth - second.depth).forEach((bubble) => {
        bubble.age += delta;
        if (bubble.age >= bubble.duration) {
          Object.assign(bubble, createAmbientBubble());
        }
        drawAmbientBubble(bubble);
      });

      ambientPetalParticles.sort((first, second) => first.depth - second.depth).forEach((petal) => {
        petal.age += delta;
        if (petal.age >= petal.duration) {
          Object.assign(petal, createAmbientPetal());
        }
        drawAmbientPetal(petal);
      });

      ambientRippleBursts = ambientRippleBursts.filter((ripple) => {
        ripple.age += delta;
        if (ripple.age >= ripple.duration) {
          return false;
        }
        drawAmbientRipple(ripple);
        return true;
      });

      ambientHeartFrame = requestAnimationFrame(animateAmbientHearts);
    }

    function createAmbientHearts() {
      if (!heartsCtx) {
        return;
      }

      if (ambientHeartStopTimer) {
        clearTimeout(ambientHeartStopTimer);
        ambientHeartStopTimer = null;
      }

      ambientHeartsEnabled = true;
      heartsLayer.classList.remove("is-hidden");
      resizeAmbientHeartsScene();
      ambientHeartParticles = Array.from({ length: ambientHeartCount }, () => createAmbientHeart(Math.random()))
        .sort((first, second) => first.depth - second.depth);
      ambientBubbleParticles = Array.from({ length: ambientBubbleCount }, () => createAmbientBubble(Math.random()))
        .sort((first, second) => first.depth - second.depth);
      ambientStardustParticles = Array.from({ length: ambientStardustCount }, () => createAmbientStardust(Math.random()));
      ambientPetalParticles = Array.from({ length: ambientPetalCount }, () => createAmbientPetal(Math.random()))
        .sort((first, second) => first.depth - second.depth);
      ambientGlimmerTrails = Array.from({ length: ambientGlimmerCount }, () => createAmbientGlimmer(Math.random()));
      rebuildAmbientMeteors();
      ambientRippleBursts = [];
      ambientHeartLastTime = 0;

      if (ambientHeartFrame) {
        cancelAnimationFrame(ambientHeartFrame);
      }

      ambientHeartFrame = requestAnimationFrame(animateAmbientHearts);
    }

    function stopAmbientHearts() {
      ambientHeartsEnabled = false;
      ambientMeteorMode = "default";
      heartsLayer.classList.add("is-hidden");

      if (ambientHeartStopTimer) {
        clearTimeout(ambientHeartStopTimer);
      }

      ambientHeartStopTimer = setTimeout(() => {
        if (ambientHeartFrame) {
          cancelAnimationFrame(ambientHeartFrame);
          ambientHeartFrame = 0;
        }
        ambientHeartParticles = [];
        ambientBubbleParticles = [];
        ambientStardustParticles = [];
        ambientPetalParticles = [];
        ambientGlimmerTrails = [];
        ambientMeteorBursts = [];
        ambientRippleBursts = [];
        ambientHeartLastTime = 0;

        if (heartsCtx) {
          heartsCtx.clearRect(0, 0, ambientHeartScene.width, ambientHeartScene.height);
        }
      }, 680);
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function updateLoveCounter() {
      const now = new Date();
      const diff = Math.max(0, now - romanceStartDate);
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor(diff / 3600000) % 24;
      const minutes = Math.floor(diff / 60000) % 60;
      const seconds = Math.floor(diff / 1000) % 60;
      loveCounter.textContent = `心动计时 ${days} 天 ${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function startLoveCounter() {
      updateLoveCounter();
      loveCounter.classList.add("show");
      if (counterTimer) {
        clearInterval(counterTimer);
      }
      counterTimer = setInterval(updateLoveCounter, 1000);
    }

    function showWish(text) {
      wishBadge.textContent = text;
      wishBadge.classList.add("show");
      clearTimeout(wishBadgeTimer);
      wishBadgeTimer = setTimeout(() => {
        wishBadge.classList.remove("show");
      }, 1800);
    }

    function revealActiveFinalLine() {

    function createMeteorSpark(featured = false) {
      const spark = document.createElement("span");
      spark.className = "meteor-spark";
