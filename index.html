    function spawnMeteor(options = {}) {
      if (!romanceStarted) {
        return;
      }

      const letterMode = options.letterMode ?? letterPanel.classList.contains("show");
      const featured = options.featured ?? (!prefersReducedMotion && Math.random() > (isMobile ? 0.94 : 0.9));
      const palette = options.palette ?? shootingMeteorPalettes[Math.floor(Math.random() * shootingMeteorPalettes.length)];
      const width = options.width ?? randomBetween(
        featured ? (isMobile ? 120 : 144) : (isMobile ? 92 : 112),
        featured ? (isMobile ? 176 : 214) : (isMobile ? 132 : 168)
      );
      const head = options.head ?? randomBetween(
        featured ? 4.4 : 3.3,
        featured ? (isMobile ? 6.8 : 7.4) : (isMobile ? 5.2 : 5.8)
      );
      const top = clamp(
        (options.top ?? (letterMode ? randomBetween(6, 16) : (8 + Math.random() * 34))) + (options.offsetY ?? 0),
        4,
        letterMode ? (isMobile ? 24 : 20) : (isMobile ? 52 : 48)
      );
      const rotate = options.rotate ?? randomBetween(letterMode ? -16 : -24, -10);
      const duration = options.duration ?? randomBetween(
        featured ? (isMobile ? 1.08 : 0.94) : (isMobile ? 0.96 : 0.84),
        featured ? (isMobile ? 1.52 : 1.28) : (isMobile ? 1.34 : 1.14)
      );
      const scale = options.scale ?? randomBetween(featured ? 1 : 0.97, featured ? 1.06 : 1.02);
      const opacity = options.opacity ?? randomBetween(featured ? 0.88 : 0.74, featured ? 0.98 : 0.9);
      const sparkCount = prefersReducedMotion ? 0 : (featured ? 2 : (Math.random() > 0.62 ? 2 : 1));
      const meteor = document.createElement("button");
      meteor.type = "button";
      meteor.className = `meteor fly${featured ? " is-featured" : ""}`;
      meteor.setAttribute("aria-label", "点击收下这颗流星");
      meteor.style.left = `${-width - randomBetween(12, 54)}px`;
      meteor.style.top = `${top.toFixed(2)}%`;
      meteor.style.setProperty("--meteor-width", `${width.toFixed(0)}px`);
      meteor.style.setProperty("--meteor-height", `${randomBetween(
        featured ? 1.8 : 1.2,
        featured ? (isMobile ? 2.8 : 3.2) : (isMobile ? 2.2 : 2.6)
      ).toFixed(2)}px`);
      meteor.style.setProperty("--meteor-head", `${head.toFixed(2)}px`);
      meteor.style.setProperty("--meteor-rotate", `${rotate.toFixed(2)}deg`);
      meteor.style.setProperty("--meteor-travel-x", `${(options.travelX ?? randomBetween(letterMode ? 116 : 108, featured ? 136 : 126)).toFixed(1)}vw`);
      meteor.style.setProperty("--meteor-travel-y", `${(options.travelY ?? randomBetween(
        letterMode ? 8 : 18,
        letterMode ? (featured ? 18 : 22) : (featured ? 30 : 38)
      )).toFixed(1)}vh`);
      meteor.style.setProperty("--meteor-duration", `${duration.toFixed(2)}s`);
      meteor.style.setProperty("--meteor-scale", scale.toFixed(2));
      meteor.style.setProperty("--meteor-opacity", opacity.toFixed(2));
      meteor.style.setProperty("--meteor-drift", `${randomBetween(-6, 6).toFixed(2)}px`);
      meteor.style.setProperty("--meteor-head-color", palette.head);
      meteor.style.setProperty("--meteor-tail-core", palette.tailCore);
      meteor.style.setProperty("--meteor-tail-soft", palette.tailSoft);
      meteor.style.setProperty("--meteor-glow", palette.glow);
      meteor.style.setProperty("--meteor-bloom", palette.bloom);

      meteor.appendChild(createMeteorGlint(featured));

      for (let index = 0; index < sparkCount; index += 1) {
        meteor.appendChild(createMeteorSpark(featured));
      }

      meteor.addEventListener("click", () => {
        showWish(meteorWishes[Math.floor(Math.random() * meteorWishes.length)]);
        meteor.remove();
      }, { once: true });
      meteor.addEventListener("animationend", (event) => {
        if (event.target === meteor && event.animationName === "meteorFly") {
          meteor.remove();
        }
      });
      meteorLayer.appendChild(meteor);
    }

    function queueMeteorWave() {
      spawnMeteor();

      if (prefersReducedMotion) {
        return;
      }

      if (Math.random() > 0.78) {
        const palette = shootingMeteorPalettes[Math.floor(Math.random() * shootingMeteorPalettes.length)];
        const top = randomBetween(8, letterPanel.classList.contains("show") ? 18 : 38);
        const rotate = randomBetween(-20, -11);
        setTimeout(() => {
          spawnMeteor({
            top: top + randomBetween(-2.5, 2.5),
            rotate: rotate + randomBetween(-1.4, 1.4),
            palette,
            featured: Math.random() > 0.76,
            duration: randomBetween(isMobile ? 0.98 : 0.86, isMobile ? 1.28 : 1.12),
            opacity: randomBetween(0.68, 0.84)
          });
        }, randomBetween(260, 540));
      }

      if (letterPanel.classList.contains("show") && Math.random() > 0.9) {
        setTimeout(() => {
          spawnMeteor({
            top: randomBetween(6, 14),
            featured: true,
            duration: randomBetween(isMobile ? 1.12 : 0.96, isMobile ? 1.42 : 1.24),
            scale: randomBetween(1.02, 1.08),
            opacity: randomBetween(0.9, 0.98)
          });
        }, randomBetween(620, 1200));
      }
    }

    function scheduleMeteorShower() {
      if (meteorTimer) {
        clearTimeout(meteorTimer);
      }

      const baseDelay = prefersReducedMotion
        ? (isMobile ? 3200 : 2800)
        : letterPanel.classList.contains("show")
          ? (isMobile ? 2600 : 2200)
          : (isMobile ? 2800 : 2100);

      meteorTimer = setTimeout(() => {
        queueMeteorWave();
        scheduleMeteorShower();
      }, baseDelay + randomBetween(-220, 320));
    }

    function startMeteorShower() {
      if (meteorTimer) {
        clearTimeout(meteorTimer);
        meteorTimer = null;
      }
      setAmbientMeteorMode("default");
    }

    function hidePanels() {
      [letterPanel, holdPanel, fireworksPanel].forEach((panel) => {
        panel.classList.remove("show");
      });
    }

    function typeLetter() {
      typingDone = false;
      typewriter.innerHTML = '<span class="type-cursor"></span>';
      let index = 0;
      const timer = setInterval(() => {
        index += 1;
        const current = letterText.slice(0, index)
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/\n/g, "<br />");
        typewriter.innerHTML = `${current}<span class="type-cursor"></span>`;
        if (index >= letterText.length) {
          clearInterval(timer);
          typingDone = true;
        }
      }, isMobile ? 44 : 32);
    }

    function showLetterPanel() {
      hidePanels();
      clearLetterDeliverySequence();
      setAmbientMeteorMode("letter");
      note.textContent = "第一段浪漫，想认真写给你。";
      letterPanel.classList.add("show");
      typeLetter();
    }

    function setHoldVisualState(state) {
      holdHeartWrap.classList.toggle("is-pressing", state === "pressing");
      holdHeartWrap.classList.toggle("is-unlocked", state === "unlocked");
    }

    function resetHoldProgress() {
      holdUnlocking = false;
      holdStartTime = 0;
      holdProgress.style.setProperty("--progress", "0deg");
      setHoldVisualState();
      if (holdFrame) {
        cancelAnimationFrame(holdFrame);
        holdFrame = 0;
      }
    }

    function unlockHoldHeart() {
      if (holdUnlocking) {
        return;
      }
      holdUnlocking = true;
      setHoldVisualState("unlocked");
      holdStatus.textContent = "好啦，这颗心已经被你解锁了。";
      showFireworksPanel();
    }

    function runHoldProgress() {
      const elapsed = performance.now() - holdStartTime;
      const ratio = Math.min(1, elapsed / 2000);
      holdProgress.style.setProperty("--progress", `${ratio * 360}deg`);
      holdStatus.textContent = ratio < 1
        ? "按住不要松开，爱心马上就要为你打开。"
        : "好啦，这颗心已经被你解锁了。";

      if (ratio >= 1) {
        unlockHoldHeart();
        return;
      }

      holdFrame = requestAnimationFrame(runHoldProgress);
    }

    function showHoldPanel() {
      hidePanels();
      clearLetterDeliverySequence();
      setAmbientMeteorMode("default");
      note.textContent = "第二段浪漫，要你亲手解锁。";
      holdStatus.textContent = "按住就好，我在这里等你。";
      resetHoldProgress();
      holdPanel.classList.add("show");
    }

    function drawRosePetalMask(ctx, x, y, length, width, angle, fillStyle, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.moveTo(0, length * 0.16);
      ctx.bezierCurveTo(-width * 0.94, -length * 0.04, -width * 0.84, -length * 0.78, 0, -length);
      ctx.bezierCurveTo(width * 0.84, -length * 0.78, width * 0.94, -length * 0.04, 0, length * 0.16);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRoundedRosePetalMask(ctx, x, y, length, width, angle, fillStyle, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.moveTo(0, length * 0.18);
      ctx.bezierCurveTo(-width * 0.92, length * 0.02, -width * 0.84, -length * 0.56, -width * 0.22, -length * 0.88);
      ctx.quadraticCurveTo(0, -length * 1.02, width * 0.22, -length * 0.88);
      ctx.bezierCurveTo(width * 0.84, -length * 0.56, width * 0.92, length * 0.02, 0, length * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRoseLeafMask(ctx, x, y, width, height, angle, fillStyle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(width * 0.22, -height * 0.6, width * 0.9, -height * 0.56, width, 0);
      ctx.bezierCurveTo(width * 0.74, height * 0.34, width * 0.2, height * 0.5, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
      ctx.lineWidth = Math.max(1.1, width * 0.04);
      ctx.beginPath();
      ctx.moveTo(width * 0.08, 0);
      ctx.quadraticCurveTo(width * 0.42, -height * 0.12, width * 0.9, -height * 0.02);
      ctx.stroke();
      ctx.restore();
    }

    function createRosePetalGradient(ctx, x, y, length, angle, palette) {
      const baseX = x - Math.sin(angle) * length * 0.14;
      const baseY = y + Math.cos(angle) * length * 0.14;
      const tipX = x + Math.sin(angle) * length * 0.98;
      const tipY = y - Math.cos(angle) * length * 0.98;
      const gradient = ctx.createLinearGradient(baseX, baseY, tipX, tipY);
      gradient.addColorStop(0, palette.base);
      gradient.addColorStop(palette.midStop ?? 0.56, palette.mid ?? palette.base);
      gradient.addColorStop(1, palette.tip ?? palette.mid ?? palette.base);
      return gradient;
    }

    function drawStyledRosePetal(ctx, config) {
      const {
        x,
        y,
        length,
        width,
        angle,
        palette,
        mask = drawRoundedRosePetalMask,
        alpha = 1,
        shadowColor = "rgba(55, 8, 29, 0.24)",
        shadowBlur = 0,
        highlightAlpha = 0.16,
        highlightAngle = -0.06
      } = config;

      ctx.save();
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlur;
      mask(
        ctx,
        x,
        y,
        length,
        width,
        angle,
        createRosePetalGradient(ctx, x, y, length, angle, palette),
        alpha
      );
      ctx.restore();

      if (highlightAlpha <= 0) {
        return;
      }

      const sideX = Math.cos(angle) * width * 0.12;
      const sideY = Math.sin(angle) * width * 0.12;
      const liftX = Math.sin(angle) * length * 0.08;
      const liftY = -Math.cos(angle) * length * 0.08;

      mask(
        ctx,
        x - sideX + liftX,
        y - sideY + liftY,
        length * 0.72,
        width * 0.4,
        angle + highlightAngle,
        createRosePetalGradient(ctx, x, y, length, angle, {
          base: "rgba(255, 255, 255, 0.02)",
          mid: "rgba(255, 226, 238, 0.34)",
          tip: "rgba(255, 247, 251, 0.78)",
          midStop: 0.74
        }),
        highlightAlpha
      );
    }

    function buildRoseBaseRing(width, height) {
      const palettes = [
        { base: "#8a183f", mid: "#d94277", tip: "#ff9fc5" },
        { base: "#9f1f4b", mid: "#ea4f88", tip: "#ffc0d9" },
        { base: "#7a1537", mid: "#c93567", tip: "#ff92ba" }
      ];
      const count = isMobile ? 18 : 24;

      return Array.from({ length: count }, (_, index) => ({
        offset: (Math.PI * 2 * index) / count + randomBetween(-0.05, 0.05),
        phase: randomBetween(0, Math.PI * 2),
        radiusBias: randomBetween(0.88, 1.14),
        length: randomBetween(isMobile ? 20 : 22, isMobile ? 28 : 34),
        width: randomBetween(isMobile ? 7 : 8, isMobile ? 11 : 14),
        alpha: randomBetween(0.74, 1),
        tilt: randomBetween(-0.2, 0.2),
        palette: palettes[index % palettes.length]
      }));
    }

    function drawRoseBaseRing(ctx, ring, elapsed, stormStrength, settle, width, height) {
      const centerX = width * 0.5;
      const centerY = height * (isMobile ? 0.86 : 0.84);
      const spin = elapsed * (prefersReducedMotion ? 0.42 : 1.08);
      const radiusX = width * (isMobile ? 0.12 : 0.145) * (1 - settle * 0.08);
      const radiusY = height * (isMobile ? 0.042 : 0.05) * (1 - settle * 0.12);
      const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radiusX * 1.4);
      glow.addColorStop(0, `rgba(255, 103, 161, ${(0.2 + stormStrength * 0.22).toFixed(3)})`);
      glow.addColorStop(0.55, `rgba(255, 84, 148, ${(0.08 + stormStrength * 0.12).toFixed(3)})`);
      glow.addColorStop(1, "rgba(255, 84, 148, 0)");

      ctx.save();
      ctx.fillStyle = glow;
      ctx.fillRect(centerX - radiusX * 1.9, centerY - radiusX, radiusX * 3.8, radiusX * 2);
      ctx.restore();

      const petals = ring.map((petal) => {
        const theta = petal.offset + spin + petal.phase * 0.08;
        const x = centerX + Math.cos(theta) * radiusX * petal.radiusBias;
        const y = centerY + Math.sin(theta) * radiusY * petal.radiusBias;
        return {
          ...petal,
          theta,
          x,
          y,
          depth: 0.56 + ((y - (centerY - radiusY)) / (radiusY * 2.2))
        };
      }).sort((left, right) => left.y - right.y);

      petals.forEach((petal) => {
        const swing = Math.sin(elapsed * 1.6 + petal.phase) * 0.12;
        const angle = petal.theta + Math.PI / 2 + petal.tilt + swing;
        const petalAlpha = (0.32 + stormStrength * 0.46) * petal.alpha * petal.depth;

        drawStyledRosePetal(ctx, {
          x: petal.x,
          y: petal.y,
          length: petal.length * (0.9 + stormStrength * 0.16) * petal.depth,
          width: petal.width * (0.88 + petal.depth * 0.18),
          angle,
          palette: petal.palette,
          alpha: petalAlpha,
          mask: drawRosePetalMask,
          shadowBlur: 4 + stormStrength * 8,
          shadowColor: "rgba(61, 8, 31, 0.22)",
          highlightAlpha: 0.1 + 0.06 * petal.depth
        });
      });

      ctx.save();
      ctx.globalAlpha = 0.12 + stormStrength * 0.2;
      ctx.strokeStyle = "rgba(255, 196, 218, 0.72)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY, radiusX * 0.92, radiusY * 0.72, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function buildRosePixelTargets(width, height) {
      const offscreen = document.createElement("canvas");
      offscreen.width = width;
      offscreen.height = height;
      const offCtx = offscreen.getContext("2d");
      const bloomCenterX = width * 0.5;
      const bloomCenterY = height * (isMobile ? 0.33 : 0.31);
      const bloomSize = Math.min(width, height) * (isMobile ? 0.24 : 0.26);

      offCtx.clearRect(0, 0, width, height);

      if (rosePhotoLoaded && rosePhoto.naturalWidth && rosePhoto.naturalHeight) {
        const sourceX = rosePhoto.naturalWidth * 0.15;
        const sourceY = rosePhoto.naturalHeight * 0.07;
        const sourceWidth = rosePhoto.naturalWidth * 0.7;
        const sourceHeight = rosePhoto.naturalHeight * 0.72;
        const drawHeight = height * 0.82;
        const drawWidth = drawHeight * (sourceWidth / sourceHeight);
        const drawX = bloomCenterX - drawWidth * 0.5;
        const drawY = height * 0.06;

        offCtx.drawImage(
          rosePhoto,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          drawX,
          drawY,
          drawWidth,
          drawHeight
        );

        const imageData = offCtx.getImageData(0, 0, width, height).data;
        const gap = prefersReducedMotion ? (isMobile ? 8 : 6) : (isMobile ? 4 : 3);
        const points = [];

        for (let y = 0; y < height; y += gap) {
          for (let x = 0; x < width; x += gap) {
            const index = (y * width + x) * 4;
            const r = imageData[index];
            const g = imageData[index + 1];
            const b = imageData[index + 2];
            const alpha = imageData[index + 3];
            const brightness = r + g + b;

            if (alpha < 80 || brightness < 46 || Math.max(r, g, b) < 28) {
              continue;
            }

            points.push({
              tx: x,
              ty: y,
              color: `${r}, ${g}, ${b}`,
              alpha: alpha / 255,
              size: gap * randomBetween(0.82, 1.1)
            });
          }
        }

        return points;
      }

      const stemGradient = offCtx.createLinearGradient(
        bloomCenterX,
        bloomCenterY + bloomSize * 0.35,
        bloomCenterX,
        height * 0.94
      );
      stemGradient.addColorStop(0, "#61cb7c");
      stemGradient.addColorStop(0.55, "#358f54");
      stemGradient.addColorStop(1, "#246940");
      offCtx.strokeStyle = stemGradient;
      offCtx.lineCap = "round";
      offCtx.lineWidth = Math.max(10, bloomSize * 0.1);
      offCtx.beginPath();
      offCtx.moveTo(bloomCenterX + bloomSize * 0.04, bloomCenterY + bloomSize * 0.52);
      offCtx.bezierCurveTo(
        bloomCenterX - bloomSize * 0.04,
        bloomCenterY + bloomSize * 0.92,
        bloomCenterX + bloomSize * 0.08,
        height * 0.68,
        bloomCenterX - bloomSize * 0.04,
        height * 0.9
      );
      offCtx.stroke();

      offCtx.save();
      offCtx.strokeStyle = "rgba(185, 255, 204, 0.34)";
      offCtx.lineWidth = Math.max(2, bloomSize * 0.018);
      offCtx.beginPath();
      offCtx.moveTo(bloomCenterX + bloomSize * 0.02, bloomCenterY + bloomSize * 0.58);
      offCtx.bezierCurveTo(
        bloomCenterX + bloomSize * 0.02,
        bloomCenterY + bloomSize * 0.98,
        bloomCenterX + bloomSize * 0.02,
        height * 0.72,
        bloomCenterX - bloomSize * 0.02,
        height * 0.87
      );
      offCtx.stroke();
      offCtx.restore();

      const leftLeafGradient = offCtx.createLinearGradient(
        bloomCenterX - bloomSize * 0.5,
        bloomCenterY + bloomSize,
        bloomCenterX + bloomSize * 0.1,
        bloomCenterY + bloomSize * 1.34
      );
      leftLeafGradient.addColorStop(0, "#60d27c");
      leftLeafGradient.addColorStop(0.56, "#3ea65f");
      leftLeafGradient.addColorStop(1, "#256b3f");
      const rightLeafGradient = offCtx.createLinearGradient(
        bloomCenterX,
        bloomCenterY + bloomSize * 1.08,
        bloomCenterX + bloomSize * 0.6,
        bloomCenterY + bloomSize * 1.54
      );
      rightLeafGradient.addColorStop(0, "#83e09b");
      rightLeafGradient.addColorStop(0.5, "#57bb72");
      rightLeafGradient.addColorStop(1, "#2d7b48");

      drawRoseLeafMask(
        offCtx,
        bloomCenterX - bloomSize * 0.08,
        bloomCenterY + bloomSize * 1.1,
        bloomSize * 0.82,
        bloomSize * 0.42,
        -0.92,
        leftLeafGradient
      );
      drawRoseLeafMask(
        offCtx,
        bloomCenterX + bloomSize * 0.01,
        bloomCenterY + bloomSize * 1.28,
        bloomSize * 0.72,
        bloomSize * 0.34,
        0.64,
        rightLeafGradient
      );

      [
        { dx: -0.28, dy: 0.46, length: 0.46, width: 0.16, angle: -1.08 },
        { dx: -0.08, dy: 0.52, length: 0.4, width: 0.14, angle: -0.48 },
        { dx: 0.08, dy: 0.52, length: 0.4, width: 0.14, angle: 0.42 },
        { dx: 0.28, dy: 0.46, length: 0.46, width: 0.16, angle: 1.08 }
      ].forEach((sepal) => {
        drawStyledRosePetal(offCtx, {
          x: bloomCenterX + sepal.dx * bloomSize,
          y: bloomCenterY + sepal.dy * bloomSize,
          length: bloomSize * sepal.length,
          width: bloomSize * sepal.width,
          angle: sepal.angle,
          mask: drawRosePetalMask,
          palette: { base: "#205e34", mid: "#3a9657", tip: "#74d48e" },
          alpha: 0.96,
          shadowBlur: bloomSize * 0.02,
          shadowColor: "rgba(14, 49, 27, 0.24)",
          highlightAlpha: 0.1
        });
      });

      const bloomBody = offCtx.createRadialGradient(
        bloomCenterX,
        bloomCenterY + bloomSize * 0.08,
        bloomSize * 0.08,
        bloomCenterX,
        bloomCenterY + bloomSize * 0.18,
        bloomSize * 0.74
      );
      bloomBody.addColorStop(0, "rgba(255, 243, 248, 0.82)");
      bloomBody.addColorStop(0.48, "rgba(241, 134, 177, 0.76)");
      bloomBody.addColorStop(1, "rgba(134, 34, 72, 0.52)");
      offCtx.fillStyle = bloomBody;
      offCtx.beginPath();
      offCtx.ellipse(
        bloomCenterX,
        bloomCenterY + bloomSize * 0.14,
        bloomSize * 0.42,
        bloomSize * 0.3,
        0,
        0,
        Math.PI * 2
      );
      offCtx.fill();

      const bloomCup = offCtx.createLinearGradient(
        bloomCenterX,
        bloomCenterY + bloomSize * 0.12,
        bloomCenterX,
        bloomCenterY + bloomSize * 0.5
      );
      bloomCup.addColorStop(0, "rgba(255, 185, 214, 0.18)");
      bloomCup.addColorStop(0.4, "rgba(204, 72, 120, 0.4)");
      bloomCup.addColorStop(1, "rgba(119, 28, 61, 0.58)");
      offCtx.fillStyle = bloomCup;
      offCtx.beginPath();
      offCtx.ellipse(
        bloomCenterX,
        bloomCenterY + bloomSize * 0.28,
        bloomSize * 0.3,
        bloomSize * 0.14,
        0,
        0,
        Math.PI * 2
      );
      offCtx.fill();

      [
        { dx: -0.5, dy: 0.16, length: 0.94, width: 0.28, angle: -1.12, palette: { base: "#6e1430", mid: "#b42c59", tip: "#ef7ea8" } },
        { dx: -0.24, dy: 0.02, length: 1.02, width: 0.32, angle: -0.8, palette: { base: "#7d1838", mid: "#cf3e6f", tip: "#ff9cc1" } },
        { dx: 0.02, dy: -0.05, length: 1, width: 0.34, angle: -0.04, palette: { base: "#8e2850", mid: "#da5889", tip: "#ffcade" } },
        { dx: 0.26, dy: 0.02, length: 0.98, width: 0.3, angle: 0.72, palette: { base: "#7c1636", mid: "#c93c6b", tip: "#ff95ba" } },
        { dx: 0.5, dy: 0.16, length: 0.9, width: 0.28, angle: 1.1, palette: { base: "#69132d", mid: "#ae2b57", tip: "#e975a1" } }
      ].forEach((petal) => {
        drawStyledRosePetal(offCtx, {
          x: bloomCenterX + petal.dx * bloomSize,
          y: bloomCenterY + petal.dy * bloomSize,
          length: bloomSize * petal.length,
          width: bloomSize * petal.width,
          angle: petal.angle,
          palette: petal.palette,
          alpha: 0.98,
          shadowBlur: bloomSize * 0.034,
          highlightAlpha: 0.14
        });
      });

      [
        { dx: -0.42, dy: 0.24, length: 0.76, width: 0.24, angle: -0.94, palette: { base: "#9a244d", mid: "#e75b8f", tip: "#ffbed5" } },
        { dx: -0.18, dy: 0.12, length: 0.84, width: 0.22, angle: -0.48, palette: { base: "#b02e5d", mid: "#f36e9f", tip: "#ffd4e3" } },
        { dx: 0.02, dy: 0.06, length: 0.84, width: 0.22, angle: -0.08, palette: { base: "#bb3a69", mid: "#ff84b0", tip: "#ffe7ef" } },
        { dx: 0.22, dy: 0.12, length: 0.8, width: 0.22, angle: 0.34, palette: { base: "#b2305e", mid: "#f06a9c", tip: "#ffd2e1" } },
        { dx: 0.42, dy: 0.24, length: 0.72, width: 0.24, angle: 0.84, palette: { base: "#97244b", mid: "#dc4d83", tip: "#ffb4cd" } }
      ].forEach((petal) => {
        drawStyledRosePetal(offCtx, {
          x: bloomCenterX + petal.dx * bloomSize,
          y: bloomCenterY + petal.dy * bloomSize,
          length: bloomSize * petal.length,
          width: bloomSize * petal.width,
          angle: petal.angle,
          palette: petal.palette,
          alpha: 0.99,
          shadowBlur: bloomSize * 0.028,
          highlightAlpha: 0.2
        });
      });

    function buildFinalHeartTargets(width, height) {
      const centerX = width * 0.5;
      const centerY = height * (isMobile ? 0.36 : 0.34);
      const scale = Math.min(width, height) * (isMobile ? 0.0142 : 0.0168);
      const points = [];
      const layers = prefersReducedMotion ? 38 : (isMobile ? 72 : 92);
      const samplesPerLayer = prefersReducedMotion ? 40 : (isMobile ? 72 : 86);
      const paletteAnchors = [
        [110, 198, 255],
        [88, 144, 255],
        [138, 235, 255],
        [192, 243, 255],
        [150, 124, 255]
      ];

      for (let layer = 0; layer < layers; layer += 1) {
        const depthRatio = layer / Math.max(1, layers - 1);
        const shell = Math.pow(depthRatio, 0.72);

        for (let sample = 0; sample < samplesPerLayer; sample += 1) {
          const t = (Math.PI * 2 * sample) / samplesPerLayer;
          const point = heartCurvePoint(t);
          const edgeBias = 0.6 + 0.4 * Math.pow(Math.abs(Math.sin(t)), 0.8);
          const radiusScale = Math.min(1, 0.16 + shell * edgeBias + Math.random() * 0.08);
          const tx = centerX + point.x * scale * radiusScale;
          const ty = centerY - point.y * scale * radiusScale;
          const anchor = paletteAnchors[(sample + layer) % paletteAnchors.length];
          const coolShift = 0.88 + Math.random() * 0.36;
          const sparkle = 0.78 + Math.random() * 0.42;
          const alpha = 0.34 + (1 - depthRatio) * 0.5 + Math.random() * 0.12;
          points.push({
            tx,
            ty,
            color: `${Math.min(255, Math.round(anchor[0] * coolShift))}, ${Math.min(255, Math.round(anchor[1] * sparkle))}, ${Math.min(255, Math.round(anchor[2] * (0.92 + Math.random() * 0.18)))}`,
            alpha: Math.min(1, alpha),
            size: (prefersReducedMotion ? 1.6 : 1.3) + Math.random() * (isMobile ? 1.6 : 2.2),
            depth: 0.5 + depthRatio * 0.7,
            halo: 6 + Math.random() * 18,
            pulse: randomBetween(0, Math.PI * 2)
          });
        }
      }

      return points.filter((_, index) => index % (prefersReducedMotion ? 2 : 1) === 0);
    }

    }

    function heartCurvePoint(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t),
        dx: 48 * Math.pow(Math.sin(t), 2) * Math.cos(t),
        dy: -13 * Math.sin(t) + 10 * Math.sin(2 * t) + 6 * Math.sin(3 * t) + 4 * Math.sin(4 * t)
      };
    }

    function heartPoints(size) {
      const points = [];
      for (let t = 0; t <= Math.PI * 2 + 0.02; t += 0.04) {
        const { x, y } = heartCurvePoint(t);
        points.push({
          x: size / 2 + x * 3.8,
          y: size / 2 - y * 3.8
        });
      }
      return points;
    }

    function drawHeart(canvas) {
      const ctx = canvas.getContext("2d");
      const points = heartPoints(canvas.width);
      let progress = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < Math.max(2, progress); i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = "#ff4f8f";
        ctx.lineWidth = 4;
        ctx.shadowColor = "rgba(255,79,143,0.7)";
        ctx.shadowBlur = 12;
        ctx.stroke();

        if (progress >= points.length) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          points.forEach((point) => ctx.lineTo(point.x, point.y));
          ctx.closePath();
          ctx.fillStyle = "rgba(255,95,158,0.2)";
          ctx.fill();
          return;
        }

        progress += 2;
        requestAnimationFrame(render);
      }

      render();
    }

    function getHeartLayout(count) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const shortEdge = Math.min(width, height);
      const scale = Math.max(9.6, Math.min(18.6, shortEdge * 0.024));
      const centerX = width * 0.5;
      const centerY = height * (width < 760 ? 0.515 : 0.53);
      const sampleCount = Math.max(420, count * 18);
      const samples = [];
      let totalLength = 0;

      for (let index = 0; index <= sampleCount; index += 1) {
        const t = (Math.PI * 2 * index) / sampleCount;
        const point = heartCurvePoint(t);
        const sample = {
          t,
          x: centerX + point.x * scale,
          y: centerY - point.y * scale,
          tangentX: point.dx,
          tangentY: -point.dy,
          distance: totalLength
        };

        if (index > 0) {
          const previous = samples[index - 1];
          totalLength += Math.hypot(sample.x - previous.x, sample.y - previous.y);
          sample.distance = totalLength;
        }

        samples.push(sample);
      }

      return Array.from({ length: count }, (_, index) => {
        const targetDistance = (totalLength * index) / count;
        let right = 1;

        while (right < samples.length && samples[right].distance < targetDistance) {
          right += 1;
        }

        const end = samples[Math.min(right, samples.length - 1)];
        const start = samples[Math.max(0, right - 1)];
        const segment = Math.max(0.0001, end.distance - start.distance);
        const mix = Math.min(1, Math.max(0, (targetDistance - start.distance) / segment));
        const x = lerp(start.x, end.x, mix);
        const y = lerp(start.y, end.y, mix);
        const tangentX = lerp(start.tangentX, end.tangentX, mix);
        const tangentY = lerp(start.tangentY, end.tangentY, mix);
        const tangentLength = Math.max(0.0001, Math.hypot(tangentX, tangentY));

        return {
          x,
          y,
          left: `${x}px`,
          top: `${y}px`,
          tangentX: tangentX / tangentLength,
          tangentY: tangentY / tangentLength,
          progress: index / Math.max(1, count - 1)
        };
      });
    }

      const width = window.innerWidth;

      const cluster = window.innerWidth < 760
        ? [
            { x: -12, y: -92 },
            { x: -74, y: -6 },
            { x: 62, y: -2 },
            { x: -34, y: 82 },
            { x: 76, y: 86 }
          ]
        : [

            { x: -54, y: 94 },
            { x: 110, y: 102 }

      note.textContent = "先把这 5 个小气泡点掉";

        cleared += 1;
        if (cleared < 5) {
          note.textContent = `还差 ${5 - cleared} 个`;
          return;
        }

      return new Promise((resolve) => {
        function spawnNext(index) {
          if (index >= texts.length) {
            introPopups = [];
            showEasterHeart().then(resolve);
            return;
          }

          const offset = cluster[index];
          const x = Math.min(width - 170, Math.max(22, centerX + offset.x));
          const y = Math.min(height - 90, Math.max(110, centerY + offset.y));
          const popup = createIntroPopup(texts[index], x, y, index);

          popup.addEventListener("click", () => {
            popup.classList.remove("show");
            popup.classList.add("pop");
            setTimeout(() => popup.remove(), 420);
            nextStep();
            setTimeout(() => spawnNext(index + 1), 220);
          }, { once: true });
        }

        spawnNext(0);
      });
    }

      });
    }

    function createBurstBlessing(index) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const popupWidth = 260;
      const popupHeight = 126;
      const verticalOffset = isMobile ? 56 : 42;
      const x = Math.random() * Math.max(40, width - popupWidth - 24);
      const y = Math.min(
        Math.random() * Math.max(40, height - popupHeight - 90) + verticalOffset,
        height - popupHeight - 26
      );
      const driftX = Math.random() * 36 - 18;
      const driftY = Math.random() * 24 - 12;
      const entryRotate = Math.random() * 12 - 6;
      const blessing = document.createElement("article");

      blessing.className = "random-blessing";
      blessing.style.left = `${x}px`;
      blessing.style.top = `${y}px`;
      blessing.style.background = miniWindowPalette[index % miniWindowPalette.length];
      blessing.innerHTML = `<div class="random-blessing-text">${getBurstBlessingText()}</div>`;

      stage.appendChild(blessing);
      burstBlessings.push(blessing);
      blessing.animate(
        [
          {
            opacity: 0,
            transform: `translateY(12px) scale(0.88) rotate(${entryRotate}deg)`,
            filter: "blur(4px)"
          },
          {
            opacity: 1,
            transform: `translateY(0) scale(1) rotate(0deg)`,
            filter: "blur(0px)",
            offset: 0.62
          },
          {
            opacity: 1,
            transform: `translate(${driftX}px, ${driftY}px) scale(1) rotate(0deg)`,
            filter: "blur(0px)"
          }
        ],
        {
          duration: 520,
          easing: "cubic-bezier(.22,.72,.2,1)",
          fill: "forwards"
        }
      );
      requestAnimationFrame(() => blessing.classList.add("show"));
    }
    function showBurstBlessings() {
      note.textContent = "藏不住的喜欢要扑出来了...";
      const count = burstBlessingCount;
      const fadeDuration = 520;
      const fadeGap = 55;
      const holdAfterAllShown = 2000;

      return new Promise((resolve) => {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            createBurstBlessing(i);
            if (i === count - 1) {
              setTimeout(() => {
                note.textContent = "就这样陪你待一会";
                [...burstBlessings].reverse().forEach((blessing, blessingIndex) => {
                  setTimeout(() => {
                    blessing.animate(
                      [
                        { opacity: 1, filter: "blur(0px)" },
                        { opacity: 0, filter: "blur(2px)" }
                      ],
                      {
                        duration: fadeDuration,
                        easing: "cubic-bezier(.22,.72,.2,1)",
                        fill: "forwards"
                      }
                    );

                    setTimeout(() => {
                      blessing.remove();
                    }, fadeDuration);
                  }, blessingIndex * fadeGap);
                });

                setTimeout(() => {
                  burstBlessings = [];
                  resolve();
                }, fadeDuration + count * fadeGap + 60);
              }, holdAfterAllShown);
            }
          }, i * 55);
        }
      });
    }

    function dropElements() {
      note.textContent = "然后，心动突然失控";
      const allWindows = [...popupElements];

      allWindows.forEach((element, index) => {
        const delay = index * 12;
        setTimeout(() => {
          element.style.transition = "top 1.8s cubic-bezier(.18,.72,.2,1), transform 1.8s ease-in, opacity 1.8s ease-in";
          element.style.top = `${window.innerHeight + 180 + Math.random() * 180}px`;

          if (element.classList.contains("popup")) {
            element.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 24 - 12}deg)`;
          } else {
            element.style.transform = `translateY(0) rotate(${Math.random() * 28 - 14}deg)`;
          }

          element.style.opacity = "0.96";
        }, delay);
      });
    }

    async function runHeartSequence() {
      if (animationLocked) return;
      animationLocked = true;
      await explodeHeartWindows();
      await showBurstBlessings();
      dropElements();
      setTimeout(() => {
        startRomanceSuite();
      }, isMobile ? 1200 : 1500);
    }

    function buildHeartWindows() {
      const layout = getHeartLayout(miniWindowCount);
      const launchStagger = isMobile ? 40 : 28;

      layout.forEach((target, index) => {
        setTimeout(() => {
          createPopup(getMiniWindowData(index), index, target, "mini");
        }, index * launchStagger + 120);
      });

      const finishDelay = layout.length * launchStagger + 1240;
      setTimeout(() => {
        runHeartSequence();
      }, finishDelay);
    }

    async function startShow() {
      if (started) return;
      started = true;
      hero.classList.add("hidden");
      note.classList.add("show");
      note.textContent = "先来一点点小互动";
      playMusic();
      await showIntroSequence();
      note.textContent = "小窗口正在排成一颗心...";
      buildHeartWindows();
    }

    document.addEventListener("pointerdown", (event) => {
      if (!ambientHeartsEnabled) {
        return;
      }

      if (typeof event.button === "number" && event.button !== 0) {
        return;
      }

      spawnAmbientRipple(event.clientX, event.clientY);
    }, { passive: true });

    startBtn.addEventListener("click", startShow);
    letterNext.addEventListener("click", () => {
      if (!typingDone) {
        typewriter.innerHTML = `${letterText.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/\n/g, "<br />")}<span class="type-cursor"></span>`;
        typingDone = true;
      } else {
        showHoldPanel();
      }
    });
    const startHold = () => {
      if (!holdPanel.classList.contains("show") || holdUnlocking) {
        return;
      }
      resetHoldProgress();
      setHoldVisualState("pressing");
      holdStartTime = performance.now();
      holdFrame = requestAnimationFrame(runHoldProgress);
    };
    const stopHold = () => {
      if (!holdUnlocking) {
        resetHoldProgress();
        holdStatus.textContent = "还差一点点，再按住我一次。";
      }
    };
    holdHeart.addEventListener("pointerdown", startHold);
    holdHeart.addEventListener("pointerup", stopHold);
    holdHeart.addEventListener("pointerleave", stopHold);
    holdHeart.addEventListener("pointercancel", stopHold);
    holdHeart.addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("selectstart", (event) => event.preventDefault());
    window.addEventListener("resize", () => {
      resizeAmbientHeartsScene();
      if (fireworksPanel.classList.contains("show")) {
        requestAnimationFrame(drawFinalHeartBloom);
      }
    });
    musicHeart.addEventListener("click", toggleMusic);
    bgm.addEventListener("play", () => setMusicState(true));
    bgm.addEventListener("pause", () => setMusicState(false));
    startLoveCounter();
    createAmbientHearts();
  </script>
</body>
</html>
